[project]
name = "yanclaw"
version = "0.1.0"
description = "LLM-driven crawler agent runtime and university faculty crawler."
readme = "docs/crawler/requirements.md"
requires-python = ">=3.11"
dependencies = [
    "html2text>=2024.2.26",
    "openai>=1.40.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.19.0",
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.1",
    "tiktoken>=0.7.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
yanclaw = "runtime.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime", "src/agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_llm: live LLM prompt validation tests gated by YANCLAW_LLM_LIVE_TESTS=1",
]
