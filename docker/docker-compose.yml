services:
  crawl4ai:
    image: unclecode/crawl4ai:latest
    ports:
      - "10086:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
